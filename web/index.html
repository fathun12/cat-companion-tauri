<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    #stage {
      position: absolute; left: 58px; top: 58px; width: 144px; height: 144px;
      transform-origin: 50% 25%;
      filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
              drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff);
    }
    .group, .layer {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      image-rendering: pixelated; pointer-events: none;
    }
    .bubble { animation: bubble 3s steps(6) infinite; }
    @keyframes bubble { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script>
    // ===== Pengaturan (sama dengan state.js) =====
    const SCALE = 3, SH = 144, CX = 130, CY = 130; // pusat kucing di jendela
    const SLEEP_AFTER_MS = 5 * 60 * 1000; // untuk tes, ubah jadi 10000 (10 detik)
    const SLEEP_HEAD_DROP = 0.14, LOVE_START_UP = 0.42;
    const FOLLOW_HEAD = 3, FOLLOW_BODY = 1;
    const PLAY_SPEED = 700, PLAY_RADIUS = 140;
    const FEET_X = 0.46, FEET_Y = 0.82;

    const rand = (a, b) => a + Math.random() * (b - a);
    const spring = (pos, vel, target, k, c, sec) => {
      vel += ((target - pos) * k - vel * c) * sec;
      return [pos + vel * sec, vel];
    };
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;
    const stage = document.getElementById('stage');

    // ===== Susun layer =====
    const defs = [
      ['ekor', 'parts/ekor.png', 'body'], ['badan', 'body/badan.png', 'body'],
      ['tangan', 'parts/tangan.png', 'body'], ['kuping', 'parts/kuping.png', 'head'],
      ['kepala', 'parts/kepala.png', 'head'], ['kumis', 'parts/kumis.png', 'head'],
      ['mata', 'eyes/mata.png', 'head'], ['mata_tidur', 'eyes/mata_tidur.png', 'head'],
      ['pupil', 'eyes/pupil.png', 'head'],
    ];
    const G = {}, P = {};
    for (const g of ['body', 'head']) {
      G[g] = document.createElement('div');
      G[g].className = 'group';
      stage.appendChild(G[g]);
    }
    for (const [id, file, g] of defs) {
      const img = new Image();
      img.className = 'layer';
      img.draggable = false;
      img.src = 'assets/cat/' + file;
      G[g].appendChild(img);
      P[id] = img;
    }
    P.mata_tidur.style.display = 'none';
    P.ekor.style.transformOrigin = '70% 80%';
    P.kuping.style.transformOrigin = '46% 14%';
    G.head.style.transformOrigin = '50% 45%';
    G.body.style.transformOrigin = FEET_X * 100 + '% ' + FEET_Y * 100 + '%';

    // Gelembung tidur
    const bubble = new Image();
    bubble.className = 'layer bubble';
    bubble.draggable = false;
    bubble.src = 'assets/effects/gelembung.png';
    bubble.style.transformOrigin = '50% 40%';
    bubble.style.display = 'none';
    stage.appendChild(bubble);

    // ===== Status =====
    let sleeping = false, sleepAmt = 0, lastActivity = performance.now();
    let lastKey = -10000, keyPulseEnd = 0;
    let cursorX = 0, cursorY = 0, lastCursorMove = -10000;
    let hovering = false, lastHoverMove = -10000, petTime = 0, purring = false, lastPurrHeart = 0;
    let dragging = false, dragMoved = false, dragSX = 0, dragSY = 0, lastSX = 0, dragVx = 0;
    let playing = false, playUntil = 0, playAmt = 0;
    let mochi = 0, mochiV = 0, tilt = 0, tiltV = 0, plant = 1;
    let fx = 0, fvx = 0, fy = 0, fvy = 0, bx = 0, bvx = 0;
    let prevT = 0, nextBlink = 2000, blinkEnd = 0;
    let nextEar = 4000, earEnd = 0, earAngle = -4, nextLook = 3000, lookX = 0;

    function setSleep(v) {
      sleeping = v;
      bubble.style.display = v ? '' : 'none';
    }

    function spawnLove() {
      const heart = new Image();
      heart.src = 'assets/effects/love.png';
      heart.className = 'layer';
      stage.appendChild(heart);
      const dx = Math.round(rand(-3, 3)) * SCALE;
      const startY = -Math.round(SH * LOVE_START_UP);
      heart.animate(
        [
          { transform: `translate(0px, ${startY}px)`, opacity: 1 },
          { transform: `translate(${dx}px, ${startY - 3 * SCALE}px)`, opacity: 0 },
        ],
        { duration: 1500, easing: 'steps(8)' }
      ).addEventListener('finish', () => heart.remove());
    }

    // ===== Loop animasi (dari animate.js) =====
    function frame(t) {
      const s = t / 1000;
      const dt = Math.min(t - prevT, 100);
      prevT = t;

      const breath = Math.round((Math.sin((s * 2 * Math.PI) / (sleeping ? 4.5 : 3.2)) + 1) / 2);

      // Tidur: kepala turun per piksel
      const target = sleeping ? 1 : 0;
      sleepAmt += Math.sign(target - sleepAmt) * Math.min(Math.abs(target - sleepAmt), dt / 700);
      const dropPx = Math.round((SH * SLEEP_HEAD_DROP) / SCALE);
      const drop = Math.round(sleepAmt * dropPx) * SCALE;

      // Bermain
      if (playing && (t > playUntil || sleeping || dragging)) playing = false;
      playAmt += ((playing ? 1 : 0) - playAmt) * Math.min(1, dt / 120);
      const crouchPx = Math.round((playAmt * SH * 0.06) / SCALE) * SCALE;
      const wigDeg = Math.sin(t / 45) * 3 * playAmt;

      // Elus
      if (hovering && !dragging && t - lastHoverMove < 250) petTime += dt;
      else petTime = Math.max(0, petTime - dt * 2);
      if (sleeping && petTime > 1500) { setSleep(false); lastActivity = t; }
      purring = !sleeping && !playing && petTime > 1000;
      if (purring && t - lastPurrHeart > 1400) { lastPurrHeart = t; spawnLove(); }
      const shake = purring ? (Math.floor(t / 70) % 2) * SCALE : 0;

      // Kepala dan badan condong ke kursor (kenyal)
      const fsec = Math.min(dt, 50) / 1000;
      let dirX = 0, dirY = 0;
      if (!sleeping && !dragging && t - lastCursorMove < 5000) {
        dirX = Math.max(-1, Math.min(1, (cursorX - CX) / 200));
        dirY = Math.max(-1, Math.min(1, (cursorY - CY) / 200));
      }
      [fx, fvx] = spring(fx, fvx, dirX * FOLLOW_HEAD * SCALE, 140, 9, fsec);
      [fy, fvy] = spring(fy, fvy, dirY * FOLLOW_HEAD * 0.6 * SCALE, 140, 9, fsec);
      [bx, bvx] = spring(bx, bvx, dirX * FOLLOW_BODY * SCALE, 90, 8, fsec);
      const headTilt = (fx / SCALE) * 1.5;
      const bodyDeg = (bx / SCALE) * 2 + wigDeg;
      const carry = (FEET_Y - 0.4) * SH * Math.sin((bodyDeg * Math.PI) / 180);
      G.head.style.transform =
        `translate(${Math.round(fx + shake + carry)}px, ${Math.round(fy + drop + crouchPx + breath * SCALE)}px) rotate(${headTilt}deg)`;
      G.body.style.transform = `rotate(${bodyDeg}deg)`;

      // Ekor
      const tailPeriod = 2.6 - 2.25 * playAmt;
      const amp = sleeping ? 5 : 10 + 15 * playAmt;
      P.ekor.style.transform =
        `rotate(${Math.round((Math.sin((s * 2 * Math.PI) / tailPeriod) * amp) / 5) * 5}deg)`;

      // Kuping
      if (t >= nextEar) {
        earEnd = t + 180;
        earAngle = Math.random() < 0.5 ? -4 : 4;
        nextEar = t + rand(4000, 9000);
      }
      P.kuping.style.transform = `rotate(${t < earEnd ? earAngle : 0}deg)`;

      // Kedip
      if (t >= nextBlink) { blinkEnd = t + 160; nextBlink = t + rand(2500, 6000); }
      const closed = sleeping || purring || t < blinkEnd;
      P.mata.style.display = closed ? 'none' : '';
      P.pupil.style.display = closed ? 'none' : '';
      P.mata_tidur.style.display = closed ? '' : 'none';

      // Pupil
      if (t >= nextLook) { lookX = Math.floor(rand(-1, 2)); nextLook = t + rand(2000, 5000); }
      const typing = !sleeping && t - lastKey < 1500;
      const following = !sleeping && t - lastCursorMove < 5000;
      let ex = lookX, ey = 0;
      if (typing) {
        ey = 1;
      } else if (following) {
        ex = Math.abs(cursorX - CX) > 30 ? Math.sign(cursorX - CX) : 0;
        ey = Math.abs(cursorY - CY) > 30 ? Math.sign(cursorY - CY) : 0;
      }
      P.pupil.style.transform = `translate(${ex * SCALE}px, ${ey * SCALE}px)`;

      // Tangan: bergerak sedikit saat scroll
      P.tangan.style.transform = `translate(0px, ${t < keyPulseEnd ? SCALE : 0}px)`;

      // Tidur kalau lama tidak ada aktivitas
      if (!sleeping && t - lastActivity > SLEEP_AFTER_MS) setSleep(true);

      // Mochi, miring saat diseret, dan kaki tetap menapak
      const sec = Math.min(dt, 50) / 1000;
      dragVx *= 0.85;
      const held = dragging && dragMoved;
      const mochiTarget = held ? 0.18 : -0.1 * playAmt;
      mochiV += (mochiTarget - mochi) * 180 * sec - mochiV * 9 * sec;
      mochi += mochiV * sec;
      if (playing) lastActivity = t;
      const tiltTarget = held ? Math.max(-15, Math.min(15, dragVx * 0.5)) : 0;
      tiltV += (tiltTarget - tilt) * 140 * sec - tiltV * 8 * sec;
      tilt += tiltV * sec;
      plant += ((held ? 0 : 1) - plant) * Math.min(1, dt / 150);
      const sy = 1 + mochi;
      const ground = (FEET_Y - 0.25) * SH * (1 - sy) * plant;
      stage.style.transform =
        `translateY(${ground}px) rotate(${tilt}deg) scale(${1 - mochi * 0.6}, ${sy})`;

      // Hemat tenaga saat tidur nyenyak
      if (sleeping && sleepAmt >= 1) setTimeout(() => requestAnimationFrame(frame), 100);
      else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ===== Pesan dari Rust =====
    // Aktivitas global (jenisnya saja). Gerak mouse tidak membangunkan.
    listen('activity', (e) => {
      const type = e.payload, now = performance.now();
      lastActivity = now;
      if (type !== 'mouse' && sleeping) setSleep(false);
      if (type === 'key') lastKey = now;
      if (type === 'scroll') keyPulseEnd = now + 110;
    });

    // Posisi kursor relatif jendela + deteksi "bermain"
    listen('cursor', (e) => {
      const [x, y] = e.payload, now = performance.now();
      const dtc = now - lastCursorMove;
      const speed = dtc > 0 && dtc < 300 ? (Math.hypot(x - cursorX, y - cursorY) / dtc) * 1000 : 0;
      cursorX = x; cursorY = y; lastCursorMove = now;
      const near = Math.hypot(x - CX, y - CY) < PLAY_RADIUS;
      const need = hovering ? PLAY_SPEED * 1.8 : PLAY_SPEED;
      if (near && !dragging && !purring && speed > need) {
        playing = true;
        playUntil = now + 1500;
        lastActivity = now;
        if (sleeping) setSleep(false);
      }
    });

    // ===== Mouse di atas kucing =====
    stage.addEventListener('mouseenter', () => { hovering = true; });
    stage.addEventListener('mouseleave', () => { hovering = false; });
    stage.addEventListener('mousemove', () => {
      lastHoverMove = performance.now();
      lastActivity = lastHoverMove;
    });
    stage.addEventListener('click', () => { if (!sleeping && !dragMoved) spawnLove(); });
    stage.addEventListener('contextmenu', (e) => e.preventDefault()); // menu menyusul

    // Seret: jendela digerakkan oleh Rust
    stage.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      dragMoved = false;
      dragSX = lastSX = e.screenX;
      dragSY = e.screenY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      if (!dragMoved) {
        if (Math.hypot(e.screenX - dragSX, e.screenY - dragSY) < 5) return;
        dragMoved = true;
        lastActivity = performance.now();
        if (sleeping) setSleep(false);
        invoke('drag_start');
      }
      dragVx = e.screenX - lastSX;
      lastSX = e.screenX;
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      if (dragMoved) invoke('drag_end');
    });
  </script>
</body>
</html>
