<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    #stage { position: absolute; transform-origin: 50% 25%; }
    .group, .layer {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      image-rendering: pixelated; pointer-events: none;
    }
    .bubble { animation: bubble 3s steps(6) infinite; }
    @keyframes bubble { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
