<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: 'Pixelify Sans';
      font-weight: 400;
      src: url('fonts/pixelify-sans-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Pixelify Sans';
      font-weight: 700;
      src: url('fonts/pixelify-sans-latin-700-normal.woff2') format('woff2');
    }
    :root {
      --fg: #e1dcc9;
      --card: #412d15;
      --bg: #1f150c;
      --black: #000000;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }
    body {
      padding: 0 10px 10px 0;
      font-family: 'Pixelify Sans', 'Courier New', monospace;
      font-size: 14px;
      color: var(--fg);
    }
    #menu {
      width: 256px;
      background: var(--bg);
      border: 3px solid var(--fg);
      box-shadow: 5px 5px 0 var(--black);
    }
    .title { display: none; }
    .sec { padding: 7px 8px; }
    .sec + .sec { border-top: 3px solid var(--card); }
    .sec > * + * { margin-top: 5px; }
    .tag {
      display: inline-block;
      margin-bottom: 4px;
      padding: 0 5px;
      background: var(--fg);
      color: var(--bg);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .row + .row { margin-top: 7px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 4px 8px;
      border: 2px solid var(--black);
      background: var(--card);
      box-shadow: 3px 3px 0 var(--black);
      color: var(--fg);
      font: inherit;
      font-weight: 700;
      text-align: left;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn:hover { background: var(--fg); color: var(--bg); }
    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }
    .btn:disabled,
    .btn:disabled:hover {
      background: var(--bg);
      color: var(--card);
      border-color: var(--card);
      box-shadow: 3px 3px 0 var(--card);
      transform: none;
      cursor: default;
    }
    .ico { flex: none; image-rendering: pixelated; }
    .status {
      padding: 2px 6px;
      background: var(--black);
      color: var(--fg);
      text-align: center;
      letter-spacing: 2px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      min-width: 32px;
      padding: 1px 6px;
      border: 2px solid var(--black);
      background: var(--card);
      box-shadow: 2px 2px 0 var(--black);
      color: var(--fg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .chip:hover { background: var(--fg); color: var(--bg); }
    .chip.on {
      background: var(--fg);
      color: var(--bg);
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    .toggle { text-transform: none; }
    .toggle span { flex: 1; font-size: 13px; line-height: 1.1; }
    .sw {
      padding: 0 6px;
      border: 2px solid var(--black);
      background: var(--bg);
      color: var(--fg);
      font-size: 12px;
    }
    .toggle.on .sw { background: var(--fg); color: var(--bg); }
    .toggle:hover .sw { background: var(--bg); color: var(--fg); }
  </style>
</head>
<body>
  <div id="menu"></div>
  <script src="menu.js"></script>
</body>
</html>
