<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #stage {
      position: absolute;
      transition: filter 0.4s;
    }
    .group, .layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      pointer-events: none;
    }
    #hud {
      display: none;
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 240px;
      padding: 2px 8px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      font: bold 12px "Courier New", monospace;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    .bubble {
      animation: bubble 3s steps(6) infinite;
    }
    @keyframes bubble {
      0%, 100% { transform: scale(0.85); }
      50%      { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud"></div>
  <script src="pet.js"></script>
</body>
</html>
